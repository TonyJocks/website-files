<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TonyJocks Payment</title>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
    }

    .payment-card {
        width: min(90%, 600px);
        padding: 30px 24px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin: 0 0 8px;
        text-align: center;
        font-size: 28px;
    }

    h2 {
        margin: 0 0 24px;
        text-align: center;
        font-size: 20px;
        font-weight: normal;
        color: #666666;
    }

    label {
        display: block;
        margin-top: 16px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cccccc;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 13px;
        border: 0;
        border-radius: 8px;
        background: #222222;
        color: #ffffff;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }

    .qr-wrapper {
        margin: 30px auto 20px;
        display: flex;
        justify-content: center;
    }

    #qrcode {
        padding: 10px;
        background: #ffffff;
    }

    #qrcode img,
    #qrcode canvas {
        display: block;
        max-width: 100%;
        height: auto;
    }

    .payment-summary {
        margin-top: 20px;
        text-align: center;
        font-size: 18px;
    }

    .payment-summary strong {
        font-size: 24px;
    }

    .reference {
        margin-top: 8px;
        color: #666666;
        font-size: 14px;
    }

    .payload-wrapper {
        margin-top: 25px;
    }

    .payload-title {
        font-weight: bold;
        margin-bottom: 8px;
    }

    #payload {
        width: 100%;
        min-height: 120px;
        padding: 12px;
        border: 1px solid #dddddd;
        border-radius: 8px;
        background: #f8f8f8;
        font-family: monospace;
        font-size: 11px;
        word-break: break-all;
        white-space: pre-wrap;
    }

    .error {
        margin-top: 15px;
        color: #b00020;
        text-align: center;
    }
</style>


</head>

<body>


<main class="payment-card">

    <h1>TonyJocks</h1>
    <h2>PromptPay Payment</h2>

    <label for="amount">Amount</label>

    <input
        type="number"
        id="amount"
        value="500"
        min="0.01"
        step="0.01"
    >

    <label for="reference">Reference</label>

    <input
        type="text"
        id="reference"
        value="TEST001"
    >

    <button id="generateButton">
        Generate QR
    </button>

    <div class="qr-wrapper">
        <div id="qrcode"></div>
    </div>

    <div class="payment-summary">

        <strong id="displayAmount">
            ฿500.00
        </strong>

        <div class="reference">
            Reference:
            <span id="displayReference">TEST001</span>
        </div>

    </div>

    <div class="payload-wrapper">

        <div class="payload-title">
            Generated Payload
        </div>

        <div id="payload">
            Click "Generate QR"
        </div>

    </div>

    <div id="error" class="error"></div>

</main>


<!-- QRCode.js -->
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>

<!-- Our PromptPay generator -->
<script src="app.js"></script>


<script>

    let qrcode = null;


    document
        .getElementById('generateButton')
        .addEventListener('click', function () {

            const amount =
                document.getElementById('amount').value;

            const reference =
                document.getElementById('reference').value.trim();

            const payloadElement =
                document.getElementById('payload');

            const errorElement =
                document.getElementById('error');

            const qrElement =
                document.getElementById('qrcode');

            const displayAmount =
                document.getElementById('displayAmount');

            const displayReference =
                document.getElementById('displayReference');


            payloadElement.textContent = '';
            errorElement.textContent = '';
            qrElement.innerHTML = '';


            try {

                const payload =
                    generatePromptPayPayload(
                        amount,
                        reference
                    );


                /*
                 * Display the generated payload
                 */

                payloadElement.textContent =
                    payload;


                /*
                 * Display payment information
                 */

                displayAmount.textContent =
                    '฿' + Number(amount).toFixed(2);

                displayReference.textContent =
                    reference;


                /*
                 * Generate QR code
                 */

                qrcode = new QRCode(
                    qrElement,
                    {
                        text: payload,
                        width: 350,
                        height: 350,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    }
                );


            } catch (error) {

                errorElement.textContent =
                    error.message;

            }

        });


</script>


</body>
</html>
