<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TonyJocks Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .payment-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 28px 22px 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #666;
            font-size: 15px;
        }

        .amount-label {
            margin-bottom: 4px;
            font-size: 14px;
            color: #777;
        }

        .amount {
            margin-bottom: 20px;
            font-size: 36px;
            font-weight: 700;
        }

        .reference-label {
            margin-bottom: 4px;
            font-size: 13px;
            color: #777;
        }

        .reference {
            margin-bottom: 24px;
            font-size: 16px;
            font-weight: 600;
            word-break: break-all;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            margin: 0 auto 20px;
        }

        #qrcode img,
        #qrcode canvas {
            max-width: 100%;
            height: auto;
        }

        .instruction {
            margin: 0;
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #c62828;
            font-size: 15px;
            line-height: 1.5;
            padding: 20px 10px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .payment-container {
                padding: 24px 18px 26px;
                border-radius: 14px;
            }

            .amount {
                font-size: 32px;
            }

            #qrcode {
                min-height: 240px;
            }
        }
    </style>

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<div class="payment-container">

    <h1 class="title">TonyJocks Payment</h1>

    <p class="subtitle">Scan the QR code to make payment</p>

    <div class="amount-label">Amount</div>
    <div id="amount" class="amount">-</div>

    <div class="reference-label">Reference</div>
    <div id="reference" class="reference">-</div>

    <div id="qrcode"></div>

    <p class="instruction">
        Open your mobile banking app and scan this QR code to make payment.
    </p>

    <div id="error" class="error" hidden></div>

</div>

<script src="app.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const params = new URLSearchParams(window.location.search);

        const amountParam = params.get("amount");
        const referenceParam = params.get("reference");

        const amountElement = document.getElementById("amount");
        const referenceElement = document.getElementById("reference");
        const qrElement = document.getElementById("qrcode");
        const errorElement = document.getElementById("error");

        function showError(message) {
            qrElement.style.display = "none";
            errorElement.hidden = false;
            errorElement.textContent = message;
        }

        if (!amountParam || !referenceParam) {
            showError("Invalid payment link.");
            return;
        }

        const amount = Number(amountParam);

        if (!Number.isFinite(amount) || amount <= 0) {
            showError("Invalid payment amount.");
            return;
        }

        const reference = referenceParam.trim();

        if (!reference) {
            showError("Invalid payment reference.");
            return;
        }

        amountElement.textContent = new Intl.NumberFormat("th-TH", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(amount) + " ฿";

        referenceElement.textContent = reference;

        try {
            const payload = generatePromptPayPayload(amount, reference);

            new QRCode(qrElement, {
                text: payload,
                width: 280,
                height: 280,
                correctLevel: QRCode.CorrectLevel.M
            });

        } catch (error) {
            console.error(error);
            showError("Unable to generate the payment QR code.");
        }
    });
</script>

</body>
</html>
