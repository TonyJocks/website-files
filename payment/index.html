<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TonyJocks Payment</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /*
         * PromptPay Payment Slip
         *
         * Original aspect ratio:
         * 74 / 105
         */

        .promptpay-wrapper {
            width: 100%;
            max-width: 904px;
            aspect-ratio: 74 / 105;
            position: relative;
            border: 2px solid #094066;
            overflow: hidden;
            margin: 0 auto;
            background-color: #fff;
        }

        /* Fallback for browsers without aspect-ratio support */
        @supports not (aspect-ratio: 1) {
            .promptpay-wrapper {
                height: calc(100vw / 74 * 105);
                max-height: 1280px;
            }
        }

        .promptpay-content {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* --------------------------------------------------
           Header
        -------------------------------------------------- */

        .promptpay-header {
            background-color: #094066;
            padding: 0;
            text-align: center;
            height: 12%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promptpay-header img {
            display: block;
            max-width: 35%;
            max-height: 90%;
            width: auto;
            height: auto;
        }

        /* --------------------------------------------------
           Payment Logos
        -------------------------------------------------- */

        .payment-logos {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 15px auto;
            width: 90%;
            height: 4.5%;
        }

        .payment-logos img {
            max-height: 100%;
            max-width: 22%;
            object-fit: contain;
            flex-basis: 22%;
        }

        /* --------------------------------------------------
           QR Code
        -------------------------------------------------- */

        .qr-section {
            width: 85%;
            margin: 0 auto;
            background-color: #fff;
        }

        .qr-code-wrapper {
            position: relative;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        /*
         * QRCode.js creates a canvas and/or image.
         * Make either one scale with the payment slip.
         */
        .qr-code {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-code canvas,
        .qr-code img {
            display: block;
            width: 100% !important;
            height: 100% !important;
            max-width: 100%;
            max-height: 100%;
        }

        /*
         * Thai QR logo positioned over the QR.
         *
         * This is the same proportional positioning
         * used in the original implementation.
         */
        .qr-code-centered-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-38.8%, -49.8%);
            width: 12%;
            max-width: 100px;
            height: auto;
            pointer-events: none;
            z-index: 2;
        }

        /* --------------------------------------------------
           Merchant Information
        -------------------------------------------------- */

        .merchant,
        .amount,
        .merchant-account,
        .currency,
        .reference {
            line-height: 1.15;
            overflow: hidden;
        }

        .merchant {
            font-size: 0.8em;
            font-weight: bold;
            text-align: left;
        }

        .amount {
            font-size: 0.8em;
            font-weight: bold;
            text-align: right;
        }

        .merchant-account {
            font-size: 0.5em;
            font-weight: bold;
            text-align: left;
        }

        .currency {
            font-size: 0.5em;
            font-weight: bold;
            text-align: right;
        }

        .reference {
            color: #777;
            font-size: 0.5em;
            text-align: left;
        }

        /* --------------------------------------------------
           Overall Scaling
        -------------------------------------------------- */

        .promptpay-wrapper {
            font-size: calc(1vw + 0.5em);
        }

        /* --------------------------------------------------
           Error
        -------------------------------------------------- */

        .payment-error {
            color: #c62828;
            font-size: 16px;
            text-align: center;
            padding: 30px 15px;
        }
    </style>
</head>

<body class="bg-light">

<div class="container-fluid py-3 py-md-4">

    <div id="payment-slip" class="promptpay-wrapper rounded-4">

        <div class="promptpay-content">

            <!-- ==========================================
                 Top Navy Section
            =========================================== -->

            <div class="promptpay-header">
                <img
                    src="assets/Thai_QR_Payment_Logo-01.jpg"
                    alt="Thai QR Payment"
                >
            </div>


            <!-- ==========================================
                 Payment Logos Section
            =========================================== -->

            <div class="payment-logos">

                <img
                    src="assets/PromptPay2.png"
                    alt="PromptPay"
                >

                <img
                    src="assets/visa_pos_fc.png"
                    alt="Visa"
                >

                <img
                    src="assets/mc_symbol_opt_73_3x.png"
                    alt="Mastercard"
                >

                <img
                    src="assets/UnionPay_Logo.png"
                    alt="UnionPay"
                >

            </div>


            <!-- ==========================================
                 QR Code Section
            =========================================== -->

            <div class="qr-section">

                <div class="qr-code-wrapper">

                    <!-- Dynamic QR generated by app.js -->
                    <div id="qrcode" class="qr-code"></div>

                    <!-- Thai QR logo overlay -->
                    <img
                        class="qr-code-centered-logo"
                        src="assets/Thai_QR_Payment_Logo-03.png"
                        alt="Thai QR Code"
                    >

                </div>


                <!-- ======================================
                     Merchant / Amount
                ======================================= -->

                <div class="row g-0">

                    <div
                        id="merchant"
                        class="col-6 merchant"
                    >
                        TONYJOCKS APPAREL
                    </div>

                    <div
                        id="amount"
                        class="col-6 amount"
                    >
                        -
                    </div>

                </div>


                <!-- ======================================
                     Merchant Account / Currency
                ======================================= -->

                <div class="row g-0">

                    <div
                        id="merchant-account"
                        class="col-8 merchant-account"
                    >
                        4787720001114259
                    </div>

                    <div
                        class="col-4 currency"
                    >
                        บาท (BAHT)
                    </div>

                </div>


                <!-- ======================================
                     Reference
                ======================================= -->

                <div class="row g-0">

                    <div
                        id="reference"
                        class="col-12 reference"
                    >
                        -
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div
        id="payment-error"
        class="payment-error"
        hidden
    ></div>

</div>


<!-- Existing PromptPay / QR generation logic -->
<script src="app.js"></script>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);

    const amountParam = params.get("amount");
    const referenceParam = params.get("reference");

    const paymentSlip = document.getElementById("payment-slip");
    const paymentError = document.getElementById("payment-error");

    const amountElement = document.getElementById("amount");
    const referenceElement = document.getElementById("reference");

    const qrElement = document.getElementById("qrcode");


    function showError(message) {

        paymentSlip.hidden = true;

        paymentError.hidden = false;
        paymentError.textContent = message;

    }


    /* -----------------------------------------------
       Validate URL parameters
    ------------------------------------------------ */

    if (!amountParam || !referenceParam) {

        showError("Invalid payment link.");

        return;
    }


    const amount = Number(amountParam);
    const reference = referenceParam.trim();


    if (!Number.isFinite(amount) || amount <= 0) {

        showError("Invalid payment amount.");

        return;
    }


    if (!reference) {

        showError("Invalid payment reference.");

        return;
    }


    /* -----------------------------------------------
       Display payment information
    ------------------------------------------------ */

    amountElement.textContent =
        new Intl.NumberFormat("th-TH", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(amount) + " ฿";


    referenceElement.textContent = reference;


    /* -----------------------------------------------
       Generate PromptPay QR
       
       IMPORTANT:
       The reference is passed unchanged.
       
       app.js handles:
       
       IV2026080753366
              ↓
       createTransactionCode()
              ↓
       KPS00IV2026080753366
    ------------------------------------------------ */

    try {

        const payload =
            generatePromptPayPayload(amount, reference);


        new QRCode(qrElement, {

            text: payload,

            width: 600,
            height: 600,

            correctLevel: QRCode.CorrectLevel.M

        });

    } catch (error) {

        console.error(error);

        showError(
            "Unable to generate the payment QR code."
        );

    }

});
</script>

</body>
</html>
