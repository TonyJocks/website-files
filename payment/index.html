<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TonyJocks Payment</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .payment-container {
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
            text-align: center;
        }

        .payment-title {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 700;
        }

        .payment-subtitle {
            margin: 0 0 20px;
            color: #666;
            font-size: 15px;
        }


        /* ==================================================
           PromptPay Placeholder
           ================================================== */

        .promptpay-wrapper {
            width: 100%;
            max-width: 904px;

            /*
             * Original design ratio:
             * 74 : 105
             */
            aspect-ratio: 74 / 105;

            position: relative;

            border: 2px solid #094066;
            overflow: hidden;

            margin: 0 auto;

            background-color: #fff;
        }

        .promptpay-content {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;
        }


        /* ==================================================
           Thai QR Payment Header
           ================================================== */

        .promptpay-header {
            background-color: #094066;

            padding: 0;

            text-align: center;

            height: 12%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promptpay-header img {
            display: block;

            max-width: 35%;
            max-height: 90%;

            width: auto;
            height: auto;
        }


        /* ==================================================
           Payment Logos
           ================================================== */

        .payment-logos {
            display: flex;

            justify-content: space-around;
            align-items: center;

            margin: 15px auto;

            width: 90%;
            height: 4.5%;
        }

        .payment-logos img {
            max-height: 100%;
            max-width: 22%;

            object-fit: contain;

            flex-basis: 22%;
        }


        /* ==================================================
           QR Code
           ================================================== */

        .qr-section {
            width: 85%;

            margin: 0 auto;

            background-color: #fff;
        }

        .qr-code-wrapper {
            position: relative;

            width: 100%;
            aspect-ratio: 1 / 1;

            overflow: hidden;
        }

        /*
         * QRCode.js creates the actual QR here.
         */
        .qr-code {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-code canvas,
        .qr-code img {
            display: block;

            width: 100% !important;
            height: 100% !important;

            max-width: 100%;
            max-height: 100%;
        }


        /* ==================================================
           Center Thai QR Logo
           ================================================== */

        .qr-code-centered-logo {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-38.8%, -49.8%);

            width: 12%;
            max-width: 100px;

            height: auto;

            pointer-events: none;

            z-index: 2;
        }


        /* ==================================================
           Merchant Information
           ================================================== */

        .promptpay-wrapper {
            font-size: calc(1vw + 0.5em);
        }

        .merchant,
        .amount,
        .merchant-account,
        .currency,
        .reference {
            line-height: 1.15;

            overflow: hidden;
        }

        .merchant {
            font-size: 0.8em;

            font-weight: bold;

            text-align: left;
        }

        .amount {
            font-size: 0.8em;

            font-weight: bold;

            text-align: right;
        }

        .merchant-account {
            font-size: 0.5em;

            font-weight: bold;

            text-align: left;
        }

        .currency {
            font-size: 0.5em;

            font-weight: bold;

            text-align: right;
        }

        .reference {
            color: #777;

            font-size: 0.5em;

            text-align: left;
        }


        /* ==================================================
           Error
           ================================================== */

        .payment-error {
            color: #c62828;

            font-size: 2rem;

            line-height: 1.5;

            padding: 30px 10px;
        }


        /* ==================================================
           Mobile
           ================================================== */

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .payment-title {
                font-size: 21px;
            }

            .payment-subtitle {
                font-size: 14px;
            }

        }
    </style>
</head>


<body>

<div class="container-fluid">

    <div class="payment-container">

      <div class="container pb-5 mb-sm-4">
        <div class="pt-5">
          <div class="card py-3 mt-sm-3">
            <div class="card-body text-center">
              <h2 class="h3 fw-bold pb-3 text-primary">Thank you for your order!</h2>
              <p class="fs-sm mb-2 text-dark">คำสั่งซื้อถูกสร้างเรียบร้อยแล้ว ชำระเงิน คำสั่งซื้อเลขที่ <span class="fw-bold text-danger" id="referenceMain"></span>
				<div class="p-2 my-4">
					<!-- ==================================================
						 PromptPay Placeholder
						 ================================================== -->

					<div
						id="payment-slip"
						class="promptpay-wrapper rounded rounded-4"
					>

						<div class="promptpay-content">


							<!-- ==================================================
								 Top Navy Section
								 ================================================== -->

							<div class="promptpay-header">

								<img
									src="assets/Thai_QR_Payment_Logo-01.jpg"
									alt="Thai QR Payment"
								>

							</div>


							<!-- ==================================================
								 Payment Logos Section
								 ================================================== -->

							<div class="payment-logos">

								<img
									src="assets/PromptPay2.png"
									alt="PromptPay"
								>

								<img
									src="assets/visa_pos_fc.png"
									alt="Visa"
								>

								<img
									src="assets/mc_symbol_opt_73_3x.png"
									alt="Mastercard"
								>

								<img
									src="assets/UnionPay_Logo.png"
									alt="UnionPay"
								>

							</div>


							<!-- ==================================================
								 QR Code Section
								 ================================================== -->

							<div class="qr-section">

								<div class="qr-code-wrapper">

									<!--
										Dynamic QR generated by app.js
									-->
									<div
										id="qrcode"
										class="qr-code"
										title="Payment QR Code"
									></div>


									<!--
										Thai QR logo overlay
									-->
									<img
										class="qr-code-centered-logo"
										src="assets/Thai_QR_Payment_Logo-03.png"
										alt="Thai QR Code"
									>

								</div>


								<!-- ==================================================
									 Merchant / Amount
									 ================================================== -->

								<div class="row g-0">

									<div
										id="merchant"
										class="col-6 merchant"
									>
										TONYJOCKS APPAREL
									</div>

									<div
										id="amount"
										class="col-6 amount"
									>
										-
									</div>

								</div>


								<!-- ==================================================
									 Merchant Account / Currency
									 ================================================== -->

								<div class="row g-0">

									<div
										id="merchant-account"
										class="col-8 merchant-account"
									>
										4787720001114259
									</div>

									<div
										class="col-4 currency"
									>
										บาท (BAHT)
									</div>

								</div>


								<!-- ==================================================
									 Reference
									 ================================================== -->

								<div class="row g-0">

									<div
										id="reference"
										class="col-12 reference"
									>
										-
									</div>

								</div>

							</div>

						</div>

					</div>


					<div
						id="payment-error"
						class="payment-error"
						hidden
					></div>

				</div>
            </div>
          </div>
        </div>
      </div>

    </div>

</div>


<!-- ==========================================================
     Existing PromptPay JavaScript
     
     DO NOT MODIFY app.js
     ========================================================== -->

<script src="app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async function () {

    /* ==========================================================
       Elements
       ========================================================== */

    const params =
        new URLSearchParams(window.location.search);

    const orderParam =
        params.get("order");


    const paymentSlip =
        document.getElementById("payment-slip");

    const paymentError =
        document.getElementById("payment-error");

    const amountElement =
        document.getElementById("amount");

    const referenceElement =
        document.getElementById("reference");

    const referenceElementMain =
        document.getElementById("referenceMain");

    const qrElement =
        document.getElementById("qrcode");


    /* ==========================================================
       Error handler
       ========================================================== */

    function showError(message) {

        paymentSlip.hidden = true;

        paymentError.hidden = false;

        paymentError.textContent = message;

    }


    /* ==========================================================
       Validate order code
       ========================================================== */

    if (!orderParam) {

        showError("Invalid payment link.");

        return;
    }


    const order =
        orderParam.trim();


    if (!order) {

        showError("Invalid payment order.");

        return;
    }


    /* ==========================================================
       Show order reference immediately
       ========================================================== */

    referenceElementMain.textContent =
        order;


    referenceElement.textContent =
        order;


    /* ==========================================================
       Get order information from Google Sheet
       ========================================================== */

    try {

        const response =
            await fetch(
			    PAYMENT_API_URL +
			    "?order=" +
			    encodeURIComponent(order)
			)


        if (!response.ok) {

            throw new Error(
                "Unable to connect to payment service."
            );

        }


        const data =
            await response.json();


        /* ======================================================
           API response validation
           ====================================================== */

        if (!data.success) {

            showError(
                data.error ||
                "Order not found."
            );

            return;
        }


        /* ======================================================
           Check payment status
           ====================================================== */

        const status =
            String(data.status || "")
                .trim()
                .toLowerCase();


        /*
         * Only Pending orders may display
         * a payment QR.
         */

        if (status !== "pending") {

            paymentSlip.hidden = true;

            paymentError.hidden = false;

            paymentError.textContent =
                "This order has already been paid.";

            return;
        }


        /* ======================================================
           Validate amount
           ====================================================== */

        const amount =
            Number(data.amount);


        if (
            !Number.isFinite(amount) ||
            amount <= 0
        ) {

            showError(
                "Invalid order amount."
            );

            return;
        }


        /* ======================================================
           Display amount
           ====================================================== */

        amountElement.textContent =
            new Intl.NumberFormat(
                "th-TH",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            ).format(amount) + " ฿";


        /* ======================================================
           Generate PromptPay QR
           
           app.js remains completely unchanged.

           The order code from Google Sheet is used
           as the PromptPay reference.
           ====================================================== */

        const payload =
            generatePromptPayPayload(
                amount,
                order
            );


        new QRCode(
            qrElement,
            {
                text: payload,

                /*
                 * Generate large QR.
                 * CSS scales it to fit the placeholder.
                 */
                width: 600,
                height: 600,

                correctLevel:
                    QRCode.CorrectLevel.M
            }
        );


    } catch (error) {

        console.error(
            "Payment lookup error:",
            error
        );


        showError(
            "Unable to retrieve order information."
        );

    }

});
</script>

</body>
</html>
